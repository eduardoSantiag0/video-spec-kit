# TEMPLATE — screenplay/<excerpt-id>/screenplay-analysis.yaml
# Schema: schemas/screenplay-analysis.schema.json · Produced by video-screenplay
# `original` fields are verbatim (source language). Everything else is English.

spec_version: 1
id: excerpt-001
project: <project-id>
source_file: source-screenplay.md
language: <BCP 47>
format_detected: <screenplay | prose | mixed>
options:                          # omit when the user passed none
  adapters: [<adapter>]
  duration_s: <seconds>

scene_headings:
  - raw: "<slugline as written>"
    line: <n>
    interior_exterior: <interior | exterior | interior-exterior>
    location: <English>
    location_original: <as written>
    time_of_day: <English>
    time_original: <as written>

characters:
  - name: <as written>
    character_id: <id>
    presence: <on-screen | offscreen | mentioned>
    match: <existing | new | ambiguous | none>
    described_in_screenplay: <stated appearance, English>

objects:
  - { name: <object>, original: <as written>, weight: <key | supporting> }

beats:                            # screenplay order — never reordered
  - id: 1
    source_lines: [<n>]
    type: <action | reveal | reaction | dialogue | sound | description>
    original: "<verbatim>"
    visual: <what is visible, English; "" for sound-only>
    characters: [<id>]
    weight: <key | minor>
    est_duration_s: <s>

dialogue:
  - { beat: <n>, character: <as written>, character_id: <id>, text: "<verbatim>", on_screen: <bool>, visual_consequence: <visible action> }

sound_cues:
  - { beat: <n>, original: "<verbatim>", cue: <English>, affects: <reaction it motivates> }

camera_hints: []
transitions: []
on_screen_text: []

non_visual:
  - id: NV1
    beat: <n>
    original: "<verbatim>"
    kind: <internal-state | memory | backstory | intention | abstract | offscreen-knowledge>
    handling: <already-evident | visible-behavior | ask | omit>
    representation: <visible representation, English>
    status: <assumed | user-confirmed | user-chosen | pending>

mood: <mood>

ambiguities:
  - { id: A1, description: <what is unclear>, critical: <bool>, resolution: <decision> }

shot_breakdown:
  visual_beats: <n>
  est_total_s: <s>
  clip_duration_s: <s>
  fits_single_generation: <bool>
  warning: <only when it does not fit>
  options_offered: [<split ...>, <reduce ...>, <lengthen ...>]
  decision: <what the user chose, or "fits — single shot">
  shots:
    - { shot: 1, beats: [1, 2], scene_id: scene-001, duration_s: <s>, summary: <one line>, camera_suggestion: <neutral coverage> }

provenance:
  screenplay: [<path>]
  user: [<path>]
  inferred: [<path>]
  default: [<path>]
