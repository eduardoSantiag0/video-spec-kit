# TEMPLATE — generation-config.yaml (reproducibility record)
# Schema: schemas/generation-config.schema.json
# The agent fills recommended values with status: planned.
# After generating, the user (or video-review) sets status: generated, seed, and output.

spec_version: 1
scene_id: scene-001
version: v001
runs:
  - id: <adapter>-1
    adapter: <adapter-id>
    status: planned               # planned | generated | discarded
    model: <checkpoint name>
    model_version: <version>
    tool: <ComfyUI | diffusers | official CLI>
    workflow: <workflow name + version>
    prompt_file: prompts/<adapter>.txt
    negative_prompt_file: prompts/<adapter>.negative.txt   # omit if the adapter has none
    seed: null                    # set the real seed after generating
    width: <px>
    height: <px>
    num_frames: <int>             # respects the adapter frame rule
    fps: <int>
    steps: <int>
    cfg: <number>
    sampler: <sampler>
    scheduler: <scheduler>
    reference_images: []
    params: {}                    # any other parameter: shift, lora, strength...
    notes: <optional>
