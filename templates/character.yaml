# TEMPLATE — characters/<id>.yaml
# Schema: schemas/character.schema.json
# Describe only what is VISIBLE and stable. Omit unknown fields.

spec_version: 1
id: <character-id>
name: <display name>
role: <role in the story>
age: <approximate, e.g. "late 20s">

body:
  height: <relative height>
  build: <build>
  skin: <skin tone>

face:
  shape: <face shape>
  eyes: <eyes>
  features: <memorable facial features>

hair:
  color: <color>
  length: <length>
  style: <style>

wardrobe:
  outfit: <main outfit, one sentence>
  colors: [<dominant color>, <secondary color>]
  accessories: [<accessory>]

distinctive_features: [<feature that makes them recognizable at a glance>]

behavior:
  demeanor: <how they carry themselves>
  movement_style: <how they move>

expressions: [<typical expression>]

consistency_lock:                 # field paths that must never change between scenes
  - hair.color
  - wardrobe.outfit

# 15–35 words, concrete, visual, no names. Reused verbatim in every prompt.
prompt_anchor: "<a [age] [person] with [hair], [face detail], wearing [outfit + colors], [distinctive feature]>"

reference_images:
  - { path: <refs/character.png>, role: character }

provenance:
  user: [<path>]
  inferred: [<path>]
  default: [<path>]
