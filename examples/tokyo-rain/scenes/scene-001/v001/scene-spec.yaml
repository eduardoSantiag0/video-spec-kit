spec_version: 1
id: scene-001
project: tokyo-rain
version: v001
title: Night ride in the rain
idea: "A woman rides a bicycle through Tokyo at night during heavy rain."
idea_language: en
intent: A quiet, lonely moment of determination — one tired rider pushing through a storm in a glowing city.

presets:
  style: cinematic
  lighting: neon-night

format:
  duration_s: 5
  aspect_ratio: "16:9"
  fps: 24
  input_mode: text-to-video

subjects:
  - id: rider
    character_id: mika
    action: rides a bicycle steadily through the rain
    expression: tired but determined, eyes narrowed against the rain
    position: center of frame, travelling left to right

environment:
  location: a narrow side street in Tokyo lined with small shops
  era: present day
  time_of_day: night
  weather: heavy rain
  atmosphere: wet reflective asphalt, puddles, rain streaks visible in the light, light mist
  background_elements:
    - glowing vertical neon signs
    - lit vending machines
    - closed shop shutters
    - a distant car's headlights

camera:
  shot_size: medium
  angle: eye-level
  lens: 35mm
  movement: tracking-side
  movement_detail: tracks alongside her from the left side at her speed, keeping her centered
  movement_speed: moderate
  framing: rider centered from the waist up, more space ahead of her in the direction of travel
  depth_of_field: shallow
  focus_target: the rider

motion:
  subject_motion: steady pedaling, upper body slightly hunched forward against the rain
  background_motion: rain falling in diagonal streaks, neon reflections rippling in puddles, shopfronts sliding past
  pace: moderate

timeline:
  first_frame: Medium side view of the rider mid-pedal, centered, raincoat glistening, neon signs softly blurred behind her, rain streaks crossing the frame.
  beats:
    - start_s: 0
      end_s: 2.5
      description: She pedals steadily through the rain and wipes rain from her brow with her right hand, then returns it to the handlebar.
    - start_s: 2.5
      end_s: 5
      description: She glances toward the camera for a moment, then looks back at the road ahead as neon light slides across her raincoat.
  last_frame: The rider still centered and pedaling, eyes on the road, both hands on the handlebars, magenta and cyan neon reflected in the wet street behind her.

constraints:
  must_not_include: [other cyclists, umbrellas, pedestrians in the foreground]

provenance:
  user:
    - presets.style
    - subjects[0].action
    - subjects[0].expression
    - environment.time_of_day
    - environment.weather
    - camera.shot_size
    - camera.movement
  inferred:
    - title
    - intent
    - presets.lighting
    - subjects[0].id
    - subjects[0].character_id
    - subjects[0].position
    - environment.location
    - environment.atmosphere
    - environment.background_elements
    - camera.movement_detail
    - camera.movement_speed
    - camera.framing
    - camera.depth_of_field
    - camera.focus_target
    - motion
    - timeline
    - constraints
  default:
    - format
    - environment.era
    - camera.angle
    - camera.lens

notes: Lighting and style come from the referenced presets (neon-night, cinematic); no lighting or style value is overridden here.
