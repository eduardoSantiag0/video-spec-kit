spec_version: 1
scene_id: scene-001
version: v002
idea_language: en
derived_from:
  scene_spec: scene-spec.yaml
  characters: [../../../characters/mika.yaml]
  presets: [style/cinematic, lighting/neon-night]
  defaults: kit/defaults.yaml

format: { duration_s: 5, aspect_ratio: "16:9", fps: 24, input_mode: text-to-video }

subjects:
  - id: rider
    character_id: mika
    anchor: "a Japanese woman in her late 20s with a short black bob, wearing a translucent yellow raincoat over a charcoal hoodie, dark jeans and white sneakers, carrying a small red backpack"
    action: rides a bicycle steadily through the rain
    expression: tired but determined, eyes narrowed against the rain
    position: center of frame, travelling left to right
    locked:
      - "hair.color: black"
      - "hair.style: straight bob with blunt bangs"
      - "wardrobe.outfit: translucent yellow raincoat over a charcoal hoodie, dark jeans, white sneakers"
      - "wardrobe.colors: yellow, charcoal"
      - "distinctive_features: translucent yellow raincoat, small red backpack"

environment:
  location: a narrow side street in Tokyo lined with small shops
  era: present day
  time_of_day: night
  weather: heavy rain
  atmosphere: wet reflective asphalt, puddles, rain streaks visible in the light, light mist
  background_elements: [glowing vertical neon signs, lit vending machines, closed shop shutters, "a distant car's headlights"]

camera:
  shot_size: medium
  angle: eye-level
  lens: 35mm
  movement: tracking-side
  movement_detail: tracks alongside her from the left side at her speed, keeping her centered
  movement_speed: moderate
  framing: rider centered from the waist up, more space ahead of her in the direction of travel
  depth_of_field: shallow
  focus_target: the rider

lighting:
  type: neon signs, shop windows and sodium street lamps
  direction: mixed practical sources from the sides and background
  quality: hard colored highlights, soft ambient glow
  contrast: high
  color_temperature: mixed
  notes: magenta and cyan neon against warm orange street lamps

motion:
  subject_motion: steady pedaling, upper body slightly hunched forward against the rain
  background_motion: rain falling in diagonal streaks, neon reflections rippling in puddles, shopfronts sliding past
  pace: moderate

style:
  visual_style: cinematic feature-film look
  realism: photorealistic
  color_grade: rich contrast with deep shadows and controlled highlights
  texture: subtle 35mm film grain

timeline:
  first_frame: Medium side view of the rider mid-pedal, centered, raincoat glistening, neon signs softly blurred behind her, rain streaks crossing the frame.
  beats:
    - { start_s: 0, end_s: 2.5, description: "She pedals steadily through the rain and wipes rain from her brow with her right hand, then returns it to the handlebar." }
    - { start_s: 2.5, end_s: 5, description: "She keeps her eyes on the road ahead and leans slightly into the pedals as neon light slides across her raincoat." }
  last_frame: The rider still centered and pedaling, eyes on the road, both hands on the handlebars, magenta and cyan neon reflected in the wet street behind her.

priorities:
  p1:
    - "subject anchor + rides a bicycle steadily through heavy rain"
    - "narrow Tokyo side street at night, heavy rain"
    - "medium shot, eye level"
    - "camera tracks alongside her from the left at her speed"
  p2:
    - "tired but determined expression"
    - "beat 1: wipes rain from her brow with her right hand"
    - "beat 2: eyes on the road, leans slightly into the pedals"
    - "neon signs and orange street lamps, magenta and cyan reflections, high contrast"
    - "wet reflective asphalt, puddles, diagonal rain streaks"
    - "glowing vertical neon signs, lit vending machines"
    - "photorealistic cinematic look, rich contrast"
  p3:
    - "subtle film grain"
    - "35mm lens, shallow depth of field"
    - "closed shop shutters, a distant car's headlights"
    - "light mist"

negatives: [other cyclists, umbrellas, pedestrians in the foreground]

complexity:
  subjects: 1
  simultaneous_actions: 1
  camera_moves: 1
  beats: 2
  risk: medium
  risk_reasons:
    - fine hand action near the face (brow wipe)

conflicts: []

warnings:
  - "0–2.5 s: one-handed brow wipe while riding → hand/anatomy instability risk"
  - "Background has neon signs: adapters must not put 'text' in the negative prompt (it would fight the signs)"

provenance:
  user:
    - subjects[0].action
    - subjects[0].expression
    - environment.time_of_day
    - environment.weather
    - camera.shot_size
    - camera.movement
    - timeline.beats[1].description
  inferred:
    - subjects[0].position
    - environment.location
    - environment.atmosphere
    - environment.background_elements
    - camera.movement_detail
    - camera.movement_speed
    - camera.framing
    - camera.depth_of_field
    - camera.focus_target
    - motion
    - timeline.first_frame
    - timeline.beats[0]
    - timeline.beats[1].start_s
    - timeline.beats[1].end_s
    - timeline.last_frame
    - negatives
  default:
    - format
    - environment.era
    - camera.angle
    - camera.lens
  preset:
    style/cinematic: [style]
    lighting/neon-night: [lighting]
  character:
    mika:
      - subjects[0].anchor
      - subjects[0].locked
