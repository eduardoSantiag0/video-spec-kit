spec_version: 1
id: scene-003
project: screenplay-kitchen
version: v001
title: A noise in the hallway
idea: |
  MARIA
  João?
  Um barulho vem do corredor.
  Maria congela.
idea_language: pt-BR
source:
  type: screenplay
  excerpt: excerpt-001
  shot: 3
  beats: [4, 5, 6]
intent: The call goes unanswered except by a noise, and fear stops her cold.

presets:
  style: cinematic

format:
  duration_s: 5
  aspect_ratio: "16:9"
  fps: 24
  input_mode: text-to-video

subjects:
  - id: maria
    character_id: maria
    action: calls out, then freezes
    expression: tense; after the noise her eyes stay fixed on the hallway
    position: center frame, facing the dark hallway doorway at the left of frame

environment:
  location: a kitchen
  interior_exterior: interior
  era: present day
  time_of_day: night
  atmosphere: silent and still, deep shadows
  background_elements: [the dark, empty doorway to the hallway at the left of frame]

camera:
  shot_size: medium-close-up
  angle: eye-level
  lens: 50mm
  movement: static
  movement_detail: camera completely still
  framing: Maria center frame, head and shoulders, the hallway doorway soft in the background left
  depth_of_field: shallow
  focus_target: Maria's face

lighting:
  type: light from the open refrigerator
  direction: from the right side of her face
  quality: hard, narrow pool of light
  contrast: high
  color_temperature: cool
  notes: the rest of the kitchen stays dark

motion:
  subject_motion: a brief call with small head movement, then complete stillness
  background_motion: none
  pace: calm

timeline:
  first_frame: Maria in a medium close-up, lit from the right by the refrigerator, looking toward the dark hallway doorway.
  beats:
    - start_s: 0
      end_s: 2
      description: She calls out toward the dark hallway.
    - start_s: 2
      end_s: 5
      description: Maria freezes.
  last_frame: Maria completely still, eyes fixed on the dark, empty hallway doorway.

audio:
  generate: false
  sfx: [a noise from the hallway (offscreen) at about 2 s]
  dialogue:
    - character: MARIA
      character_id: maria
      text: "João?"
      on_screen: true

constraints:
  must_not_include: [other people, a figure in the hallway]

continuity:
  previous_scene: scene-002
  must_remain_consistent: [refrigerator light as the only light source, Maria's locked traits, night]

provenance:
  screenplay:
    - subjects[0].action
    - environment.location
    - environment.interior_exterior
    - environment.time_of_day
    - lighting.type
    - timeline.beats[1].description
    - audio.sfx
    - audio.dialogue
  user:
    - presets.style
  inferred:
    - title
    - intent
    - subjects[0].id
    - subjects[0].character_id
    - subjects[0].expression
    - subjects[0].position
    - environment.atmosphere
    - environment.background_elements
    - camera.shot_size
    - camera.lens
    - camera.movement_detail
    - camera.framing
    - camera.depth_of_field
    - camera.focus_target
    - lighting.direction
    - lighting.quality
    - lighting.contrast
    - lighting.color_temperature
    - lighting.notes
    - motion
    - timeline.first_frame
    - timeline.beats[0]
    - timeline.beats[1].start_s
    - timeline.beats[1].end_s
    - timeline.last_frame
    - constraints.must_not_include
    - continuity
  default:
    - format
    - environment.era
    - camera.angle
    - camera.movement
    - audio.generate

notes: "\"João?\" is preserved verbatim in audio.dialogue and is not sent to the video model (audio.generate: false). The noise is a sound cue, never an image; it only motivates the freeze and the gaze toward the hallway. João is mentioned only, so nobody appears in the hallway."
