spec_version: 1
scene_id: scene-003
version: v001
idea_language: pt-BR
derived_from:
  scene_spec: scene-spec.yaml
  characters: [../../../characters/maria.yaml]
  presets: [style/cinematic]
  defaults: kit/defaults.yaml
  screenplay_analysis: ../../../screenplay/excerpt-001/screenplay-analysis.yaml
source:
  type: screenplay
  excerpt: excerpt-001
  shot: 3
  beats: [4, 5, 6]

format: { duration_s: 5, aspect_ratio: "16:9", fps: 24, input_mode: text-to-video }

subjects:
  - id: maria
    character_id: maria
    anchor: "a woman in her early 30s with shoulder-length dark brown hair tied loosely back, wearing an oversized grey t-shirt and dark sweatpants"
    action: calls out, then freezes
    expression: tense; after the noise her eyes stay fixed on the hallway
    position: center frame, facing the dark hallway doorway at the left of frame
    locked:
      - "hair.color: dark brown"
      - "hair.style: tied loosely back"
      - "wardrobe.outfit: oversized grey t-shirt and dark sweatpants"
      - "wardrobe.colors: grey, dark navy"

environment:
  location: a kitchen
  interior_exterior: interior
  era: present day
  time_of_day: night
  atmosphere: silent and still, deep shadows
  background_elements: [the dark, empty doorway to the hallway at the left of frame]

camera:
  shot_size: medium-close-up
  angle: eye-level
  lens: 50mm
  movement: static
  movement_detail: camera completely still
  movement_speed: slow
  framing: Maria center frame, head and shoulders, the hallway doorway soft in the background left
  depth_of_field: shallow
  focus_target: Maria's face

lighting:
  type: light from the open refrigerator
  direction: from the right side of her face
  quality: hard, narrow pool of light
  contrast: high
  color_temperature: cool
  notes: the rest of the kitchen stays dark

motion:
  subject_motion: a brief call with small head movement, then complete stillness
  background_motion: none
  pace: calm

style:
  visual_style: cinematic feature-film look
  realism: photorealistic
  color_grade: rich contrast with deep shadows and controlled highlights
  texture: subtle 35mm film grain

timeline:
  first_frame: Maria in a medium close-up, lit from the right by the refrigerator, looking toward the dark hallway doorway.
  beats:
    - { start_s: 0, end_s: 2, description: "She calls out toward the dark hallway." }
    - { start_s: 2, end_s: 5, description: "Maria freezes." }
  last_frame: Maria completely still, eyes fixed on the dark, empty hallway doorway.

audio:
  generate: false
  sfx: [a noise from the hallway (offscreen) at about 2 s]
  dialogue:
    - { character: MARIA, character_id: maria, text: "João?", on_screen: true }

continuity:
  previous_scene: scene-002
  must_remain_consistent: [refrigerator light as the only light source, Maria's locked traits, night]

priorities:
  p1:
    - "subject anchor + calls out toward the dark hallway, then suddenly freezes"
    - "kitchen at night, lit only by an open refrigerator"
    - "medium close-up, eye level, static camera"
  p2:
    - "tense, eyes fixed on the dark hallway doorway"
    - "cold, hard light on the right side of her face, high contrast"
    - "the hallway doorway black and empty"
    - "photorealistic cinematic look"
  p3:
    - "shallow depth of field"
    - "subtle film grain"

negatives: [other people, a figure in the hallway]

complexity:
  subjects: 1
  simultaneous_actions: 1
  camera_moves: 0
  beats: 2
  risk: medium
  risk_reasons:
    - face in a medium close-up with a small head movement

conflicts: []
warnings:
  - "0–2 s: speaking motion in a medium close-up → minor mouth/face instability risk; the words are not generated (audio.generate: false)."
  - "The noise (beat 5) is not visible; it is represented only by the sudden freeze at 2 s. Add the sound in editing."

provenance:
  screenplay:
    - subjects[0].action
    - environment.location
    - environment.interior_exterior
    - environment.time_of_day
    - lighting.type
    - timeline.beats[1].description
    - audio.sfx
    - audio.dialogue
  user:
    - presets.style
  inferred:
    - subjects[0].expression
    - subjects[0].position
    - environment.atmosphere
    - environment.background_elements
    - camera.shot_size
    - camera.lens
    - camera.movement_detail
    - camera.framing
    - camera.depth_of_field
    - camera.focus_target
    - lighting.direction
    - lighting.quality
    - lighting.contrast
    - lighting.color_temperature
    - lighting.notes
    - motion
    - timeline.first_frame
    - timeline.beats[0]
    - timeline.last_frame
    - negatives
    - continuity
  default:
    - format
    - environment.era
    - camera.angle
    - camera.movement
    - camera.movement_speed
    - audio.generate
  preset:
    style/cinematic: [style]
  character:
    maria:
      - subjects[0].anchor
      - subjects[0].locked
