spec_version: 1
scene_id: scene-001
version: v001
idea_language: pt-BR
derived_from:
  scene_spec: scene-spec.yaml
  characters: [../../../characters/maria.yaml]
  presets: [style/cinematic]
  defaults: kit/defaults.yaml
  screenplay_analysis: ../../../screenplay/excerpt-001/screenplay-analysis.yaml
source:
  type: screenplay
  excerpt: excerpt-001
  shot: 1
  beats: [1, 2]

format: { duration_s: 5, aspect_ratio: "16:9", fps: 24, input_mode: text-to-video }

subjects:
  - id: maria
    character_id: maria
    anchor: "a woman in her early 30s with shoulder-length dark brown hair tied loosely back, wearing an oversized grey t-shirt and dark sweatpants"
    action: slowly enters the dark kitchen and steps into the light of the open refrigerator
    expression: cautious
    position: starts in the doorway in the background, walks toward camera and stops center frame
    locked:
      - "hair.color: dark brown"
      - "hair.style: tied loosely back"
      - "wardrobe.outfit: oversized grey t-shirt and dark sweatpants"
      - "wardrobe.colors: grey, dark navy"

environment:
  location: a kitchen
  interior_exterior: interior
  era: present day
  time_of_day: night
  atmosphere: silent and still, deep shadows
  background_elements: [an open refrigerator at the right edge of frame, kitchen counters and cabinets in shadow, a dark doorway to the hallway]

camera:
  shot_size: medium
  angle: eye-level
  lens: 35mm
  movement: static
  movement_detail: camera completely still inside the kitchen; she walks toward it into the light
  movement_speed: slow
  framing: doorway in the background, Maria ending center frame from the waist up
  depth_of_field: moderate
  focus_target: Maria

lighting:
  type: light from the open refrigerator
  direction: low, from the right side of frame
  quality: hard, narrow pool of light
  contrast: high
  color_temperature: cool
  notes: the rest of the kitchen stays dark

motion:
  subject_motion: slow, careful steps
  background_motion: none — the kitchen is still
  pace: calm

style:
  visual_style: cinematic feature-film look
  realism: photorealistic
  color_grade: rich contrast with deep shadows and controlled highlights
  texture: subtle 35mm film grain

timeline:
  first_frame: The dark kitchen, a pool of cold light from the open refrigerator on the floor at the right; Maria stands in the dark doorway in the background.
  beats:
    - { start_s: 0, end_s: 2.5, description: "Maria slowly enters the dark kitchen." }
    - { start_s: 2.5, end_s: 5, description: "The light from the open refrigerator illuminates her face." }
  last_frame: Maria in a medium shot, her face lit by the cold refrigerator light, the rest of the kitchen dark.

continuity:
  next_scene: scene-002
  must_remain_consistent: [refrigerator light as the only light source, Maria's locked traits, night]

priorities:
  p1:
    - "subject anchor + slowly enters the dark kitchen"
    - "kitchen at night, lit only by an open refrigerator"
    - "medium shot, eye level, static camera"
    - "refrigerator light illuminates her face"
  p2:
    - "cautious expression"
    - "cold, hard light from the right, high contrast, rest of the kitchen dark"
    - "dark doorway to the hallway behind her"
    - "photorealistic cinematic look"
  p3:
    - "counters and cabinets in shadow"
    - "subtle film grain"

negatives: [other people, a lamp or ceiling light turned on]

complexity:
  subjects: 1
  simultaneous_actions: 1
  camera_moves: 0
  beats: 2
  risk: low
  risk_reasons: []

conflicts: []
warnings:
  - "Travelling subject with a static camera (C12): she walks toward the camera and stops, so she stays in frame — keep the walk short."

provenance:
  screenplay:
    - subjects[0].action
    - environment.location
    - environment.interior_exterior
    - environment.time_of_day
    - lighting.type
    - motion.subject_motion
    - timeline.beats[0].description
    - timeline.beats[1].description
  user:
    - presets.style
  inferred:
    - subjects[0].expression
    - subjects[0].position
    - environment.atmosphere
    - environment.background_elements
    - camera.movement_detail
    - camera.framing
    - camera.focus_target
    - lighting.direction
    - lighting.quality
    - lighting.contrast
    - lighting.color_temperature
    - lighting.notes
    - motion.background_motion
    - motion.pace
    - timeline.first_frame
    - timeline.last_frame
    - negatives
    - continuity
  default:
    - format
    - environment.era
    - camera.shot_size
    - camera.angle
    - camera.lens
    - camera.movement
    - camera.movement_speed
    - camera.depth_of_field
  preset:
    style/cinematic: [style]
  character:
    maria:
      - subjects[0].anchor
      - subjects[0].locked
