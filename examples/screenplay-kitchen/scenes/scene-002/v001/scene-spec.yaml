spec_version: 1
id: scene-002
project: screenplay-kitchen
version: v001
title: Broken glass
idea: |
  Ela percebe um copo quebrado no chão.
idea_language: pt-BR
source:
  type: screenplay
  excerpt: excerpt-001
  shot: 2
  beats: [3]
intent: The broken glass is the first sign that something is wrong.

presets:
  style: cinematic

format:
  duration_s: 3
  aspect_ratio: "16:9"
  fps: 24
  input_mode: text-to-video

subjects:
  - id: glass
    description: a broken drinking glass
    action: lies shattered on the floor
    position: center of frame at the end of the tilt

environment:
  location: a kitchen
  interior_exterior: interior
  era: present day
  time_of_day: night
  atmosphere: silent and still
  background_elements: [dark floor tiles, the edge of the refrigerator's pool of light]

camera:
  shot_size: close-up
  angle: pov
  lens: 35mm
  movement: tilt
  movement_detail: slow tilt down from the dark floor ahead to the glass shards, as if her gaze finds them
  movement_speed: slow
  framing: shards centered at the end of the move
  depth_of_field: shallow
  focus_target: the glass shards

lighting:
  type: light from the open refrigerator
  direction: low, from the side
  quality: hard, narrow pool of light
  contrast: high
  color_temperature: cool
  notes: the rest of the kitchen stays dark

motion:
  subject_motion: none — the shards lie still and glint
  background_motion: none
  pace: calm

timeline:
  first_frame: Dark floor tiles at the edge of the cold refrigerator light.
  beats:
    - start_s: 0
      end_s: 3
      description: She notices a broken glass on the floor.
  last_frame: Close-up of the broken glass shards glinting in the cold refrigerator light.

constraints:
  must_include: [a broken glass on the floor]
  must_not_include: [other people, blood, feet or hands in frame]

continuity:
  previous_scene: scene-001
  next_scene: scene-003
  must_remain_consistent: [refrigerator light as the only light source, night]

provenance:
  screenplay:
    - subjects[0].description
    - subjects[0].action
    - environment.location
    - environment.interior_exterior
    - environment.time_of_day
    - lighting.type
    - timeline.beats[0].description
    - constraints.must_include
  user:
    - presets.style
  inferred:
    - title
    - intent
    - format.duration_s
    - subjects[0].id
    - subjects[0].position
    - environment.atmosphere
    - environment.background_elements
    - camera
    - lighting.direction
    - lighting.quality
    - lighting.contrast
    - lighting.color_temperature
    - lighting.notes
    - motion
    - timeline.first_frame
    - timeline.beats[0].start_s
    - timeline.beats[0].end_s
    - timeline.last_frame
    - constraints.must_not_include
    - continuity
  default:
    - format.aspect_ratio
    - format.fps
    - format.input_mode
    - environment.era

notes: Maria is not visible — the POV tilt carries "she notices". "blood" and "feet or hands in frame" are excluded so the model does not add story the screenplay does not have.
