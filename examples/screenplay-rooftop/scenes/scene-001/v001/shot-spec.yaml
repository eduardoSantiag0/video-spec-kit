spec_version: 1
scene_id: scene-001
version: v001
derived_from:
  scene_spec: scene-spec.yaml
  characters: [../../../characters/elena.yaml]
  presets: [style/cinematic]
  defaults: kit/defaults.yaml
  screenplay_analysis: ../../../screenplay/excerpt-001/screenplay-analysis.yaml
source:
  type: screenplay
  excerpt: excerpt-001
  shot: 1
  beats: [1, 2]

format: { duration_s: 5, aspect_ratio: "16:9", fps: 24, input_mode: text-to-video }

subjects:
  - id: elena
    character_id: elena
    anchor: "a woman in her 60s with silver hair gathered in a low bun and a warm, lined face, wearing a grey wool cardigan"
    action: waters a row of tomato plants, then pauses and looks out over the waking city
    expression: quiet and content
    position: left of center, the row of tomato plants in the right foreground
    locked:
      - "hair.color: silver"
      - "hair.style: gathered in a low bun"
      - "wardrobe.outfit: grey wool cardigan"

environment:
  location: a rooftop garden above a city
  interior_exterior: exterior
  era: present day
  time_of_day: dawn
  weather: clear, still air
  atmosphere: soft morning haze over the rooftops
  background_elements: [city rooftops and buildings in the distance, a few windows still lit]

camera:
  shot_size: medium
  angle: eye-level
  lens: 35mm
  movement: dolly-in
  movement_detail: slow push-in toward her, ending closer as she looks out over the city
  movement_speed: very-slow
  framing: Elena left of center with space on the right toward the city
  depth_of_field: moderate
  focus_target: Elena

lighting:
  type: low warm sunlight near the horizon
  direction: side light from the rising sun
  color_temperature: warm

motion:
  subject_motion: steady tilting of the watering can, then stillness
  background_motion: haze drifting slowly over the rooftops, water falling on the leaves
  pace: calm

style:
  visual_style: cinematic feature-film look
  realism: photorealistic
  color_grade: rich contrast with deep shadows and controlled highlights
  texture: subtle 35mm film grain

timeline:
  first_frame: Medium shot of Elena tilting a metal watering can over a row of tomato plants, the city soft in the haze behind her.
  beats:
    - { start_s: 0, end_s: 2.5, description: "Elena waters a row of tomato plants with a watering can." }
    - { start_s: 2.5, end_s: 5, description: "She pauses and looks out over the waking city." }
  last_frame: Closer on Elena standing still, looking out over the city with a quiet, content expression, warm light on her face.

priorities:
  p1:
    - "subject anchor + waters a row of tomato plants"
    - "rooftop garden above a city at dawn"
    - "medium shot, eye level"
    - "slow push-in toward her"
  p2:
    - "beat 2: pauses and looks out over the waking city"
    - "quiet, content expression"
    - "low warm sunlight from the rising sun, side light"
    - "city rooftops in the distance, soft morning haze"
    - "photorealistic cinematic look"
  p3:
    - "a few windows still lit"
    - "subtle film grain"

negatives: [other people]

complexity:
  subjects: 1
  simultaneous_actions: 1
  camera_moves: 1
  beats: 2
  risk: low
  risk_reasons: []

conflicts: []
warnings: []

provenance:
  screenplay:
    - subjects[0].action
    - environment.location
    - environment.interior_exterior
    - environment.time_of_day
    - timeline.beats[0].description
    - timeline.beats[1].description
  user:
    - presets.style
  inferred:
    - subjects[0].expression
    - subjects[0].position
    - environment.weather
    - environment.atmosphere
    - environment.background_elements
    - camera.movement
    - camera.movement_detail
    - camera.movement_speed
    - camera.framing
    - camera.focus_target
    - lighting
    - motion
    - timeline.first_frame
    - timeline.last_frame
    - negatives
  default:
    - format
    - environment.era
    - camera.shot_size
    - camera.angle
    - camera.lens
    - camera.depth_of_field
  preset:
    style/cinematic: [style]
  character:
    elena:
      - subjects[0].anchor
      - subjects[0].locked
