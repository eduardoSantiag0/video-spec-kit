spec_version: 1
id: scene-001
project: screenplay-rooftop
version: v001
title: Watering at dawn
idea: |
  EXT. ROOFTOP GARDEN - DAWN
  ELENA (60s), in a grey wool cardigan, waters a row of tomato plants.
  She pauses and looks out over the waking city.
  Elena has waited all winter for this morning.
idea_language: en
source:
  type: screenplay
  excerpt: excerpt-001
  shot: 1
  beats: [1, 2]
intent: A quiet, private moment of contentment at the end of a long wait.

presets:
  style: cinematic

format:
  duration_s: 5
  aspect_ratio: "16:9"
  fps: 24
  input_mode: text-to-video

subjects:
  - id: elena
    character_id: elena
    action: waters a row of tomato plants, then pauses and looks out over the waking city
    expression: quiet and content
    position: left of center, the row of tomato plants in the right foreground

environment:
  location: a rooftop garden above a city
  interior_exterior: exterior
  era: present day
  time_of_day: dawn
  weather: clear, still air
  atmosphere: soft morning haze over the rooftops
  background_elements:
    - city rooftops and buildings in the distance
    - a few windows still lit

camera:
  shot_size: medium
  angle: eye-level
  lens: 35mm
  movement: dolly-in
  movement_detail: slow push-in toward her, ending closer as she looks out over the city
  movement_speed: very-slow
  framing: Elena left of center with space on the right toward the city
  depth_of_field: moderate
  focus_target: Elena

lighting:
  type: low warm sunlight near the horizon
  direction: side light from the rising sun
  color_temperature: warm

motion:
  subject_motion: steady tilting of the watering can, then stillness
  background_motion: haze drifting slowly over the rooftops, water falling on the leaves
  pace: calm

timeline:
  first_frame: Medium shot of Elena tilting a metal watering can over a row of tomato plants, the city soft in the haze behind her.
  beats:
    - start_s: 0
      end_s: 2.5
      description: Elena waters a row of tomato plants with a watering can.
    - start_s: 2.5
      end_s: 5
      description: She pauses and looks out over the waking city.
  last_frame: Closer on Elena standing still, looking out over the city with a quiet, content expression, warm light on her face.

constraints:
  must_include: [a row of tomato plants]
  must_not_include: [other people]

provenance:
  screenplay:
    - subjects[0].action
    - environment.location
    - environment.interior_exterior
    - environment.time_of_day
    - timeline.beats[0].description
    - timeline.beats[1].description
    - constraints.must_include
  user:
    - presets.style
  inferred:
    - title
    - intent
    - subjects[0].id
    - subjects[0].character_id
    - subjects[0].expression
    - subjects[0].position
    - environment.weather
    - environment.atmosphere
    - environment.background_elements
    - camera.movement
    - camera.movement_detail
    - camera.movement_speed
    - camera.framing
    - camera.focus_target
    - lighting
    - motion
    - timeline.first_frame
    - timeline.beats[0].start_s
    - timeline.beats[0].end_s
    - timeline.beats[1].start_s
    - timeline.beats[1].end_s
    - timeline.last_frame
    - constraints.must_not_include
  default:
    - format
    - environment.era
    - camera.shot_size
    - camera.angle
    - camera.lens
    - camera.depth_of_field

notes: subjects[0].expression represents NV1 ("Elena has waited all winter for this morning") as subtle performance only — see screenplay-analysis.yaml. Lighting comes from the kit inference rule for sunrise.
