# Kit-wide defaults. Lowest layer of value resolution (see kit/conventions.md §5).
# A value taken from here is tagged `default` in provenance.
# Projects override these in project.yaml → defaults.

format:
  duration_s: 5            # most open video models are tuned for ~5 s clips
  aspect_ratio: "16:9"
  fps: 24                  # intent fps; adapters may generate at native fps and interpolate
  input_mode: text-to-video

camera:
  shot_size: medium
  angle: eye-level
  lens: 35mm
  movement: static
  movement_speed: slow
  depth_of_field: moderate

motion:
  pace: moderate

style:
  realism: photorealistic
  visual_style: neutral cinematic look, natural color

environment:
  era: present day

# Inference rules: applied BEFORE falling back to the static defaults above.
# A value produced by a rule is tagged `inferred`, not `default`.
# Rules are evaluated top to bottom; the first rule that sets a field wins.
# Rules never overwrite a value the user stated.
inference_rules:
  - when: "environment.time_of_day is night"
    set:
      lighting.type: artificial practical light (street lamps, signs, windows)
      lighting.contrast: high
  - when: "environment.time_of_day is golden hour / sunset / sunrise"
    set:
      lighting.type: low warm sunlight
      lighting.direction: side or back light
      lighting.color_temperature: warm
  - when: "environment.weather is overcast / rain / fog and time_of_day is day"
    set:
      lighting.contrast: low
  - when: "environment.weather is rain and time_of_day is night"
    set:
      environment.atmosphere: wet reflective surfaces
  - when: "camera.shot_size is close-up or extreme-close-up"
    set:
      camera.lens: 85mm
      camera.depth_of_field: shallow
  - when: "camera.shot_size is wide or extreme-wide"
    set:
      camera.lens: 24mm
      camera.depth_of_field: deep
  - when: "the idea names a platform with vertical video (TikTok, Reels, Shorts, Stories)"
    set:
      format.aspect_ratio: "9:16"

# Target prompt adapters when project.yaml does not list any.
adapters: [wan, ltx]

# Quality negatives are adapter-specific: see adapters/<id>/adapter.md → "Negative prompt".
